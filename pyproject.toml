[project]
name = "ujn-llm-api"
version = "1.0.0"
description = "Local proxy exposing UJN ChatUJN (WebVPN) as OpenAI / Anthropic / Responses compatible APIs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "litellm[proxy]==1.100.1",
    "playwright>=1.45.0",
    "PyYAML>=6.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]
